<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate Candy Ultra PWA Assets</title>
  <style>
    body { background: #0d0714; color: white; font-family: sans-serif; padding: 2rem; text-align: center; }
    button { background: #a855f7; color: white; border: none; padding: 12px 24px; margin: 10px; font-size: 16px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #9333ea; }
  </style>
</head>
<body>
  <h1>Candy Ultra Asset Generator</h1>
  <p>Click below to download the exact PNG assets required by PWABuilder:</p>
  <button onclick="generateAsset(512, 512, 'Candy Ultra', 'icon-512.png')">Download icon-512.png</button>
  <button onclick="generateAsset(1080, 1920, 'Candy Ultra Mobile View', 'screenshot-mobile.png')">Download screenshot-mobile.png</button>
  <button onclick="generateAsset(1920, 1080, 'Candy Ultra Desktop View', 'screenshot-desktop.png')">Download screenshot-desktop.png</button>

  <script>
    function generateAsset(width, height, text, filename) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      // Background Gradient matching #0d0714 and primary brand purple #a855f7
      const grad = ctx.createLinearGradient(0, 0, width, height);
      grad.addColorStop(0, '#0d0714');
      grad.addColorStop(1, '#2e1065');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Icon / Text styling
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `bold ${Math.floor(width / 12)}px sans-serif`;
      ctx.fillText(text, width / 2, height / 2);

      // Accent Circle
      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = Math.floor(width / 60);
      ctx.beginPath();
      ctx.arc(width / 2, height / 2, Math.min(width, height) * 0.35, 0, 2 * Math.PI);
      ctx.stroke();

      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
