
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#64D3FF" />
      <stop offset="100%" stop-color="#2980B9" />
    </radialGradient>
    <radialGradient id="candyRed" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF6B81" />
      <stop offset="45%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#C70039" />
    </radialGradient>
    <radialGradient id="sparkleGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF8C00" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F2B48" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base background using exact #5BCEFA theme -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Inner glowing circle within 80% safe zone for maskable icons -->
  <circle cx="256" cy="240" r="140" fill="url(#candyRed)" filter="url(#shadow)" stroke="#FFF" stroke-width="8"/>
  
  <!-- Swirl highlight on candy -->
  <path d="M 200 170 Q 256 125 312 170 Q 355 240 312 305 Q 256 350 200 305 Q 155 240 200 170" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Specular highlight -->
  <ellipse cx="215" cy="185" rx="30" ry="18" transform="rotate(-30 215 185)" fill="rgba(255,255,255,0.85)" />

  <!-- Mini sparkles -->
  <polygon points="360,130 366,145 381,151 366,157 360,172 354,157 339,151 354,145" fill="url(#sparkleGrad)" filter="url(#shadow)"/>
  <polygon points="140,290 144,300 154,304 144,308 140,318 136,308 126,304 136,300" fill="url(#sparkleGrad)"/>
  <polygon points="370,330 374,340 384,344 374,348 370,358 366,348 356,344 366,340" fill="url(#sparkleGrad)"/>

  <!-- App Title Banner inside safe zone -->
  <rect x="76" y="380" width="360" height="64" rx="32" fill="#FFFFFF" filter="url(#shadow)" stroke="#FFD700" stroke-width="3"/>
  <text x="256" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#C70039" text-anchor="middle" letter-spacing="1">CANDY CRUSH</text>
</svg>
