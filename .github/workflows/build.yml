name: Build Android App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android Tool
        uses: android-actions/setup-android@v4

      - name: Install Dependencies & Capacitor Android
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init --web-dir out MyApp com.myapp.app --yes
          npx cap add android

      - name: Build App
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Save APK File
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: android/app/build/outputs/apk/release/app-release.apk
